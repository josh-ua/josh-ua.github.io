const width = 900, height = 700, margin = {top: 40, right: 30, bottom: 50, left: 60};
const svg = d3.select('#chart').append('svg')
  .attr('width', width)
  .attr('height', height);

const x = d3.scaleLinear().domain([0,1]).range([margin.left, width - margin.right]);
const y = d3.scaleLinear().domain([0,1]).range([height - margin.bottom, margin.top]);

svg.append('g')
  .attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).ticks(5));

svg.append('g')
  .attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(5));

// diagonal
svg.append('line')
  .attr('x1', x(0)).attr('y1', y(0))
  .attr('x2', x(1)).attr('y2', y(1))
  .attr('stroke', '#888').attr('stroke-dasharray', '6,4');

svg.append('text')
  .attr('x', width/2).attr('y', height - 10)
  .attr('text-anchor', 'middle')
  .text('Average Predicted YES Probability (bucket avg)');

svg.append('text')
  .attr('transform', 'rotate(-90)')
  .attr('x', -height/2).attr('y', 16)
  .attr('text-anchor', 'middle')
  .text('Observed YES Rate');

const tooltip = d3.select('#tooltip');
const bucketMeta = d3.select('#bucketMeta');
const tableBody = d3.select('#bucketTable tbody');

const windows = data.series;
const select = d3.select('#windowSelect');

windows.forEach(w => {
  select.append('option')
    .attr('value', w.end_offset_h)
    .text(`${w.end_offset_h}h (window ${w.start_offset_h}h→${w.end_offset_h}h)`);
});

function render(endOffset) {
  const w = windows.find(d => d.end_offset_h == endOffset);
  const rows = w ? w.rows : [];

  svg.selectAll('.point').remove();

  const maxCount = d3.max(rows, d => d.count) || 1;
  const rScale = d3.scaleSqrt().domain([1, maxCount]).range([4, 16]);

  svg.selectAll('.point')
    .data(rows)
    .enter()
    .append('circle')
    .attr('class', 'point')
    .attr('cx', d => x(d.avg_pred))
    .attr('cy', d => y(d.yes_rate))
    .attr('r', d => rScale(d.count))
    .attr('fill', '#3b82f6')
    .attr('fill-opacity', 0.7)
    .attr('stroke', '#111')
    .attr('stroke-width', 0.4)
    .on('mousemove', (event, d) => {
      tooltip.style('display', 'block')
        .style('left', (event.pageX + 10) + 'px')
        .style('top', (event.pageY - 20) + 'px')
        .html(`Bucket ${d.bucket}<br>Count: ${d.count}<br>Avg pred: ${d.avg_pred.toFixed(3)}<br>Yes rate: ${d.yes_rate.toFixed(3)}`);
    })
    .on('mouseout', () => tooltip.style('display', 'none'))
    .on('click', (event, d) => {
      bucketMeta.html(`Selected bucket: <b>${d.bucket}</b> (count ${d.count}, yes ${d.yes}, no ${d.no}, avg_pred ${d.avg_pred.toFixed(3)}, yes_rate ${d.yes_rate.toFixed(3)})`);
      const rows = d.markets || [];
      const tr = tableBody.selectAll('tr').data(rows, r => r.id);
      tr.exit().remove();
      const trEnter = tr.enter().append('tr');
      trEnter.append('td'); trEnter.append('td'); trEnter.append('td'); trEnter.append('td');
      trEnter.merge(tr).select('td:nth-child(1)').text(r => r.ticker || '');
      trEnter.merge(tr).select('td:nth-child(2)').text(r => r.company || '');
      trEnter.merge(tr).select('td:nth-child(3)').text(r => r.outcome || '');
      trEnter.merge(tr).select('td:nth-child(4)').text(r => (r.avg_pred ?? 0).toFixed(3));
    });
}

select.on('change', (event) => render(event.target.value));
render(windows[0].end_offset_h);
