{{ define "main" }}
{{ partial "back_link.html" .}}

<h1>{{ .Title | lower }}</h1>

{{ .Content }}

{{ if .Data.Terms }}
<ul>
  {{ range .Data.Terms.Alphabetical }}
  <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title | lower }}</a> ({{ .Count }})</li>
  {{ end }}
</ul>
{{ else }}
<p>Nothing here yet.</p>
{{ end }}
{{ end }}
